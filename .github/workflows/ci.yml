name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

  database-import:
    name: Schema imports cleanly
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: commerza
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Import database/commerza.sql
        run: mysql -h 127.0.0.1 -uroot -proot commerza < database/commerza.sql
      - name: Verify core tables and seed data
        run: |
          mysql -h 127.0.0.1 -uroot -proot commerza -N -e "SELECT COUNT(*) FROM products" | grep -qv '^0$'
          mysql -h 127.0.0.1 -uroot -proot commerza -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='commerza'"
