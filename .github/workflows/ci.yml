name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

  database-import:
    name: Schema imports cleanly
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: commerza
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Import database/commerza.sql
        run: mysql -h 127.0.0.1 -uroot -proot commerza < database/commerza.sql
      - name: Verify core tables and seed data
        run: |
          mysql -h 127.0.0.1 -uroot -proot commerza -N -e "SELECT COUNT(*) FROM products" | grep -qv '^0$'
          mysql -h 127.0.0.1 -uroot -proot commerza -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='commerza'"

  docker-e2e:
    name: Docker stack · security probe · load · Playwright
    needs: [php-lint, database-import]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Smoke test (15 journeys, one pass each)
        run: php tests/load/load_test.php http://localhost:8080 15 1
      - name: Security probe (headers, CSP, SQLi, XSS, exposure, rate limit, uploads)
        run: docker compose exec -T app php scripts/security/security_probe.php http://localhost
      - name: SEO audit
        run: php scripts/quality/seo_audit.php http://localhost:8080
      - name: Load test (15 concurrent users, 60s)
        env:
          COMMERZA_LOAD_P95_MS: "2500"
        run: php tests/load/load_test.php http://localhost:8080 15 60
      - name: Stress test (60 concurrent users, 45s, informational)
        continue-on-error: true
        run: php tests/load/load_test.php http://localhost:8080 60 45
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Playwright E2E (desktop + mobile)
        working-directory: tests/e2e
        env:
          COMMERZA_BASE_URL: http://localhost:8080
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
