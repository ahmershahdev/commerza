name: Bug report
description: Something in the storefront or admin panel is not working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page/route (e.g. /cart, /admin-panel → Orders) and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "PHP 8.2 / MariaDB 10.4 / XAMPP on Windows / Chrome 130"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Apache/PHP error log lines or browser console output. Remove any secrets or personal data.
